name: Desktop builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - platform: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            xcode: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake clang libfontconfig1-dev \
            libfreetype6-dev libglib2.0-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev
      - name: Select Xcode
        if: runner.os == 'macOS'
        run: |
          if [ -d "${{ matrix.xcode }}" ]; then
            sudo xcode-select --switch "${{ matrix.xcode }}"
          fi
          xcodebuild -version
      - name: Install the project toolchain
        run: |
          rustup show active-toolchain
          rustup target add "${{ matrix.target }}"
      - name: Test
        run: cargo test --locked --release --target "${{ matrix.target }}"
      - name: Build
        run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          $name = 'hermes-desktop-lite.exe'
          Copy-Item -LiteralPath "target/${{ matrix.target }}/release/$name" -Destination dist
          $digest = (Get-FileHash -LiteralPath "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "dist/$name.sha256" -Value "$digest  $name" -Encoding ascii
          $notices = @(
            'LICENSE', 'THIRD_PARTY_NOTICES.md', 'assets/tabler/LICENSE',
            'assets/codicon/LICENSE', 'assets/codicon/NOTICE',
            'assets/phosphor/LICENSE', 'assets/fonts/OFL-BodoniModa.txt'
          )
          $gap = [Environment]::NewLine + [Environment]::NewLine
          $sections = foreach ($path in $notices) {
            $path + $gap + (Get-Content -LiteralPath $path -Raw).TrimEnd()
          }
          Set-Content -LiteralPath dist/LICENSES.txt -Value ($sections -join ($gap + '---' + $gap)) -Encoding utf8
      - name: Package Linux and macOS
        if: runner.os != 'Windows'
        run: bash scripts/package-desktop.sh "${{ matrix.platform }}" "target/${{ matrix.target }}/release/hermes-desktop-lite"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hermes-desktop-lite-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
