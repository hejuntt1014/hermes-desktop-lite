name: Desktop builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            xcode: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake clang libfontconfig1-dev \
            libfreetype6-dev libglib2.0-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev
      - name: Select Xcode
        if: runner.os == 'macOS'
        run: |
          if [ -d "${{ matrix.xcode }}" ]; then
            sudo xcode-select --switch "${{ matrix.xcode }}"
          fi
          xcodebuild -version
      - name: Install the project toolchain
        run: |
          rustup show active-toolchain
          rustup target add "${{ matrix.target }}"
      - name: Test and build
        run: |
          cargo test --locked --release --target "${{ matrix.target }}"
          cargo build --locked --release --target "${{ matrix.target }}"
      - name: Package
        run: bash scripts/package-desktop.sh "${{ matrix.platform }}" "target/${{ matrix.target }}/release/hermes-desktop-lite"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hermes-desktop-lite-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
