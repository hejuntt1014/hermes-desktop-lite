name: Mobile builds
on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target (Android ARM64 publishes from main)
        required: true
        default: android-arm64
        type: choice
        options:
          - android-arm64
          - android-x64
          - ios-simulator
          - ios-unsigned
permissions:
  contents: read
jobs:
  mobile:
    name: ${{ inputs.target }}
    runs-on: ${{ startsWith(inputs.target, 'ios-') && 'macos-15' || 'ubuntu-24.04' }}
    outputs:
      android_version: ${{ steps.android.outputs.version }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Flutter
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth=1 origin tag 3.50.1
          git -C "$RUNNER_TEMP/flutter" checkout --detach refs/tags/3.50.1
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = ae9b586f34a8443573f82ef57c3bf914a908cbf7
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - name: Build Android APK
        id: android
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ inputs.target }}
        run: |
          case "$TARGET" in
            android-arm64) platform=android-arm64; abi=arm64-v8a ;;
            android-x64) platform=android-x64; abi=x86_64 ;;
            *) exit 1 ;;
          esac
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          flutter build apk --no-pub --release --split-per-abi \
            --target-platform "$platform" --build-number "$GITHUB_RUN_NUMBER"
          mkdir -p build/preview
          cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "build/preview/hermes-mobile-$TARGET.apk"
          version=$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)(\+[0-9]+)?$/\1/p' pubspec.yaml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Sign Android release APK
        if: inputs.target == 'android-arm64' && github.ref == 'refs/heads/main'
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          ANDROID_RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
        run: |
          : "${ANDROID_RELEASE_KEYSTORE:?Missing ANDROID_RELEASE_KEYSTORE}"
          : "${ANDROID_RELEASE_PASSWORD:?Missing ANDROID_RELEASE_PASSWORD}"
          umask 077
          keystore=$(mktemp)
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ANDROID_RELEASE_KEYSTORE" | base64 --decode > "$keystore"
          export JAVA_HOME="$JAVA_HOME_21_X64"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$keystore" --ks-type PKCS12 --ks-key-alias hermes-android \
            --ks-pass env:ANDROID_RELEASE_PASSWORD --key-pass env:ANDROID_RELEASE_PASSWORD \
            build/preview/hermes-mobile-android-arm64.apk
      - name: Build unsigned iOS device app
        if: inputs.target == 'ios-unsigned'
        run: |
          flutter build ios --no-pub --release --no-codesign
          test -f build/ios/iphoneos/Runner.app/PlugIns/ShareExtension.appex/Info.plist
          mkdir -p build/preview
          ditto -c -k --keepParent build/ios/iphoneos/Runner.app build/preview/hermes-mobile-ios-unsigned.zip
      - name: Build and launch the iOS Simulator app
        if: inputs.target == 'ios-simulator'
        run: |
          flutter build ios --no-pub --debug --simulator
          test -f build/ios/iphonesimulator/Runner.app/PlugIns/ShareExtension.appex/Info.plist
          simulator_sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)
          device=$(xcrun simctl list devices available -j | python3 -c '
          import json
          import sys

          devices = json.load(sys.stdin)["devices"]
          sdk_version = tuple(map(int, sys.argv[1].split(".")[:2]))
          def version(runtime):
              return tuple(map(int, runtime.split(".iOS-")[1].split("-")[:2]))

          runtimes = sorted(
              (runtime for runtime in devices if ".iOS-" in runtime and version(runtime) <= sdk_version),
              key=version,
              reverse=True,
          )
          for runtime in runtimes:
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone") and device["isAvailable"]:
                      print(device["udid"])
                      sys.exit(0)
          sys.exit("No available iPhone simulator")
          ' "$simulator_sdk")
          trap 'xcrun simctl shutdown "$device" || true' EXIT
          xcrun simctl bootstatus "$device" -b
          app=build/ios/iphonesimulator/Runner.app
          bundle=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          xcrun simctl install "$device" "$app"
          launch=$(xcrun simctl launch "$device" "$bundle")
          printf '%s\n' "$launch"
          pid=${launch##*: }
          sleep 5
          if [[ ! "$pid" =~ ^[1-9][0-9]*$ ]] || ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::The app did not stay running after launch."
            exit 1
          fi
          mkdir -p build/preview
          ditto -c -k --keepParent "$app" build/preview/hermes-mobile-ios-simulator.zip
      - name: Upload preview
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: hermes-mobile-${{ inputs.target }}
          path: mobile/build/preview/
          if-no-files-found: error

  publish-android:
    name: Publish Android ARM64 preview
    if: inputs.target == 'android-arm64' && github.ref == 'refs/heads/main'
    needs: mobile
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: hermes-mobile-android-arm64
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.mobile.outputs.android_version }}
        run: |
          tag="android-v${VERSION}-preview.${GITHUB_RUN_NUMBER}"
          apk=hermes-mobile-android-arm64.apk
          gh release create "$tag" "$apk" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Hermes Lite Android v${VERSION} Preview ${GITHUB_RUN_NUMBER}" \
            --notes 'Android ARM64 预览版。 / Android ARM64 preview.'
