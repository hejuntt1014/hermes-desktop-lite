[package]
name = "hermes-desktop-lite"
version = "0.1.1"
edition = "2024"
rust-version = "1.100"
publish = false
description = "A lightweight Rust and GPUI desktop client for Hermes Agent"
license = "MIT"
repository = "https://github.com/hejuntt1014/hermes-desktop-lite"

[dependencies]
base64 = "0.22"
calamine = { version = "0.38", features = ["chrono"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha2 = "0.11"
anyhow = "1"
dirs = "6"
futures-util = "0.3"
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-component = { version = "=0.10.0", features = ["tree-sitter"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12" }
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
markdown = "1"
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3.2"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "fs", "process"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "9", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
x11rb = "0.13"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["wayland", "x11"] }

[target.'cfg(windows)'.dependencies]
jsonc-parser = { version = "0.34", features = ["serde"] }
windows = { version = "0.61.3", features = ["Data_Xml_Dom", "UI_Notifications", "Foundation"] }
winreg = "0.56"
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.12"
